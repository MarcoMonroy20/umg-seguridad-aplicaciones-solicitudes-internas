env:
  contexts:
    - name: laboratorio
      urls: ["http://127.0.0.1:8000"]
  parameters:
    failOnError: true
    failOnWarning: false
jobs:
  - type: passiveScan-config
    parameters:
      scanOnlyInScope: true
  - type: requestor
    requests:
      - url: http://127.0.0.1:8000/
        method: GET
        responseCode: 200
      - url: http://127.0.0.1:8000/openapi.json
        method: GET
        responseCode: 200
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: report
    parameters:
      template: traditional-json
      reportDir: ../reportes-locales
      reportFile: zap-pasivo
      reportTitle: Evaluación HTTP pasiva del laboratorio
    sites: ["http://127.0.0.1:8000"]
