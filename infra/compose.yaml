services:
  api:
    build: ..
    image: solicitudes-internas:lab
    ports:
      - "127.0.0.1:8000:8000"
    user: "10001:10001"
    privileged: false
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      SOLICITANTE_TOKEN: ${SOLICITANTE_TOKEN:-}
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:-}
